<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4f7cff" />
  <title>我的工作台</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="工作台" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="app-bar">
      <div class="app-bar__title" id="appTitle">工作台</div>
      <button class="icon-btn" id="themeToggle" aria-label="切换主题">🌗</button>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar" id="tabbar">
      <button class="tab" data-view="home"><span class="tab__icon">🏠</span><span class="tab__label">主页</span></button>
      <button class="tab" data-view="health"><span class="tab__icon">💚</span><span class="tab__label">健康</span></button>
      <button class="tab" data-view="korean"><span class="tab__icon">📚</span><span class="tab__label">韩语</span></button>
      <button class="tab" data-view="launcher"><span class="tab__icon">📱</span><span class="tab__label">启动台</span></button>
      <button class="tab" data-view="relax"><span class="tab__icon">🌿</span><span class="tab__label">放松</span></button>
      <button class="tab" data-view="more"><span class="tab__icon">⚙️</span><span class="tab__label">我的</span></button>
    </nav>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="store.js"></script>
  <script src="health.js"></script>
  <script src="korean.js"></script>
  <script src="launcher.js"></script>
  <script src="more.js"></script>
  <script src="relax.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* file:// 或非 https 环境忽略 */ });
      });
    }
  </script>
</body>
</html>
